<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" role="img" aria-labelledby="t d">
  <title id="t">Flusso di traffic-light-review</title>
  <desc id="d">A fine turno lo Stop hook calcola il diff dall'ultima review. Sotto soglia Jev non viene chiamato e il diff si accumula. Sopra soglia Jev risponde a 18 domande e le regole decidono: no, silenzio; sì, Claude chiede se avviare la review. Se confermi, un subagent in sola lettura con le regole di Open Code Review restituisce un verdetto di al massimo 15 righe.</desc>
  <style>
    .box   { fill: #f6f8fa; stroke: #d0d7de; }
    .note  { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
    .jev   { fill: #fff8c5; stroke: #bf8700; }
    .green { fill: #dafbe1; stroke: #1a7f37; }
    .red   { fill: #ffebe9; stroke: #cf222e; }
    .line  { stroke: #57606a; fill: none; stroke-width: 1.5; }
    .dash  { stroke-dasharray: 5 4; }
    .head  { fill: #57606a; }
    .lamp-r { fill: #cf222e; } .lamp-g { fill: #1a7f37; }
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; text-anchor: middle; }
    .title { font-size: 15px; font-weight: 600; }
    .sub   { font-size: 12px; fill: #57606a; }
    .code  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #57606a; }
    .label { font-size: 12px; font-weight: 600; fill: #57606a; }
    .label-g { fill: #1a7f37; } .label-r { fill: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .box   { fill: #161b22; stroke: #30363d; }
      .note  { stroke: #6e7681; }
      .jev   { fill: #2e2410; stroke: #d29922; }
      .green { fill: #12261e; stroke: #3fb950; }
      .red   { fill: #2d1214; stroke: #f85149; }
      .line  { stroke: #8b949e; }
      .head  { fill: #8b949e; }
      .lamp-r { fill: #f85149; } .lamp-g { fill: #3fb950; }
      text   { fill: #e6edf3; }
      .sub, .code, .label { fill: #8b949e; }
      .label-g { fill: #3fb950; } .label-r { fill: #f85149; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Riga 1: la pipeline di ogni fine turno -->
  <rect class="box" x="21" y="20" width="150" height="64" rx="10"/>
  <text class="title" x="96" y="47">Fine turno</text>
  <text class="sub" x="96" y="66">Stop hook</text>

  <rect class="box" x="193" y="20" width="150" height="64" rx="10"/>
  <text class="title" x="268" y="47">Diff</text>
  <text class="sub" x="268" y="66">dall'ultima review</text>

  <rect class="box" x="365" y="20" width="150" height="64" rx="10"/>
  <text class="title" x="440" y="47">Pre-filtro</text>
  <text class="code" x="440" y="66">righe ≥ min_lines</text>

  <rect class="jev" x="537" y="20" width="150" height="64" rx="10"/>
  <text class="title" x="612" y="47">Jev</text>
  <text class="sub" x="612" y="66">18 domande tipizzate</text>

  <rect class="box" x="709" y="20" width="150" height="64" rx="10"/>
  <text class="title" x="784" y="47">Regole</text>
  <text class="code" x="784" y="66">decision.review</text>

  <path class="line" d="M171 52 H191" marker-end="url(#a)"/>
  <path class="line" d="M343 52 H363" marker-end="url(#a)"/>
  <path class="line" d="M515 52 H535" marker-end="url(#a)"/>
  <text class="label" x="526" y="44">sì</text>
  <path class="line" d="M687 52 H707" marker-end="url(#a)"/>

  <!-- Riga 2: baseline, sotto soglia, esiti -->
  <rect class="note" x="21" y="140" width="322" height="64" rx="10"/>
  <text class="title" x="182" y="162">Baseline</text>
  <text class="sub" x="182" y="180">si sposta quando una review è proposta</text>
  <text class="sub" x="182" y="196">o al tetto <tspan class="code">prefilter.max_lines</tspan></text>
  <path class="line dash" d="M268 84 V138"/>

  <rect class="note" x="365" y="140" width="150" height="64" rx="10"/>
  <text class="title" x="440" y="162">Sotto soglia</text>
  <text class="sub" x="440" y="180">niente Jev,</text>
  <text class="sub" x="440" y="196">il diff si accumula</text>
  <path class="line dash" d="M440 84 V138" marker-end="url(#a)"/>
  <text class="label" x="452" y="116">no</text>

  <rect class="green" x="537" y="140" width="150" height="64" rx="10"/>
  <circle class="lamp-g" cx="556" cy="172" r="7"/>
  <text class="title" x="625" y="168">Silenzio</text>
  <text class="sub" x="625" y="186">nessun messaggio</text>
  <path class="line" d="M752 84 V112 H612 V138" marker-end="url(#a)"/>
  <text class="label label-g" x="682" y="106">no</text>

  <rect class="red" x="709" y="140" width="150" height="64" rx="10"/>
  <circle class="lamp-r" cx="733" cy="172" r="7"/>
  <text class="title" x="794" y="162">«La avvio?»</text>
  <text class="sub" x="794" y="180">Claude chiede</text>
  <text class="sub" x="794" y="196">no → si prosegue</text>
  <path class="line" d="M816 84 V138" marker-end="url(#a)"/>
  <text class="label label-r" x="830" y="116">sì</text>

  <!-- Riga 3: review solo dopo la conferma -->
  <rect class="box" x="679" y="260" width="180" height="64" rx="10"/>
  <text class="title" x="769" y="282">Review</text>
  <text class="sub" x="769" y="300">subagent in sola lettura</text>
  <text class="sub" x="769" y="316">regole Open Code Review</text>
  <path class="line" d="M784 204 V258" marker-end="url(#a)"/>
  <text class="label" x="832" y="236">confermi</text>

  <rect class="box" x="477" y="260" width="180" height="64" rx="10"/>
  <text class="title" x="567" y="282">Verdetto</text>
  <text class="sub" x="567" y="300">≤ 15 righe</text>
  <text class="sub" x="567" y="316">nella tua sessione</text>
  <path class="line" d="M679 292 H659" marker-end="url(#a)"/>
</svg>
